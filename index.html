<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRA - Room Decor Planner</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
       
<style>
body {
    background: #f6f3ff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;}


h1 {
    color: #6c4ab6;
    text-align: center;}


.top-note {
    text-align: center;
    color: #888;
    font-size: 13px;}


.main {
    display: flex;
    gap: 15px;
    max-width: 1000px;
    margin: 20px auto;
    flex-wrap: wrap;}


.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    flex: 1;
    min-width: 280px;}


label {
    font-size: 13px;
    font-weight: bold;
    display: block;
    margin-top: 12px;
    color: #444;}


select, input {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ddd;}


.upload {
    border: 2px dashed #b9a6e0;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    margin-top: 15px;
    cursor: pointer;
    background: #faf8ff;}


.preview {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 10px;
    display: none;}


.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;}


.btn-main {
    background: #6c4ab6;
    color: white;}


.btn-main:hover {
    background: #5a3aa0;}


.result {
    display: flex;
    gap: 12px;
    background: #fbf9ff;
    border: 1px solid #e9e2ff;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;}


.result:hover {
    background: #f0eaff;}


.tag {
    display: inline-block;
    background: #eee7ff;
    color: #6c4ab6;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    margin: 3px 3px 0 0;}


.bar {
    height: 6px;
    background: #eee;
    border-radius: 10px;
    margin-top: 6px;
    overflow: hidden;}


.fill {
    height: 100%;
    background: #6c4ab6;}


.score {
    font-weight: bold;
    color: #6c4ab6;
    font-size: 18px;}


.hero {
    display: flex;
    gap: 15px;
    align-items: center;
    background: #f3efff;
    padding: 15px;
    border-radius: 12px;}


.decor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;}


.decor {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    text-align: center;}


.wish {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: #6c4ab6;
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);}


@media (max-width: 600px) {
    .card 
       { min-width: 0;}
    

    .main > div {
        width: 100%;}}
    

</style>
</head>

<body>

<h1>ASTRA ✨</h1>
<p class="top-note">
    Find simple decor ideas to make your room feel more like you.
</p>

<div class="main">

    <div style="flex:1; min-width:280px;">
        <div class="card">
            <h3>Your Room</h3>

        <label for="room">Room Size</label>
        <select id="room">
            <option>Small</option>
            <option selected>Medium</option>
            <option>Large</option>
        </select>

        <label for="pref">What style do you like?</label>
        <select id="pref">
            <option selected>Surprise me</option>
             <option>Minimalist</option>
             <option>Cozy</option>
            <option>Biophilic</option>
            <option>Scandinavian</option>
            <option>Color Pop</option>
            <option>Modern Luxury</option>
            <option>Zen</option>
            <option>Study Focus</option>
            <option>Space Saving</option>
            <option>Pastel Dream</option>
            </select>

            <label for="budget">Your Budget</label>
            <select id="budget">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
            </select>

            <label for="space">How important is free space?</label>
            <select id="space">
                <option>Not important</option>
                <option selected>Somewhat important</option>
                <option>Very important</option>
            </select>

         <div class="upload" id="drop">
        <div style="font-size:32px;">📸</div>
        <b>Upload a picture of your room</b><br>
        <span style="font-size:12px;color:#888;">
             Click here to choose a photo
                </span>

          <input type="file" id="file" accept="image/*" hidden>
        <img id="prev" class="preview" alt="Room preview">
        </div>

    <button class="btn btn-main" onclick="analyzeRoom()">
            ✨ FIND MY ROOM STYLE
           </button>

            <div style="margin-top:12px;">
                <canvas id="radar" height="200"></canvas>
            </div>
    </div>
    </div>

    <div style="flex:1; min-width:280px;">
    <div class="card">
     <h3>🏆 Room Ideas For You</h3>
    <div id="results">
     <p style="text-align:center;padding:30px;color:#bbb;">
         Choose your preferences and click the button to get ideas.
        </p>
        </div>
        </div>

     <div id="detail" style="display:none; margin-top:15px;"></div>
    </div>

</div>


<div class="wish">
    🛍️ Wishlist: <b id="wishCount">0</b>
</div>

<script>
// Room styles and the things that suit each one.

const designs = {
    "Minimalist": {
        desc: "A clean and simple look.",
        colors: ["White", "Grey", "Sage"],
        icon: "✨",
        budgets: ["Low", "Medium"],
        room: "Small" },
   
    "Cozy": {
        desc: "Warm colours and a comfortable feel.",
        colors: ["Beige", "Orange", "Cream"],
        icon: "🧸",
        budgets: ["Low", "Medium"],
        room: "Small" },
   
    "Biophilic": {
        desc: "Bring a little nature indoors.",
        colors: ["Green", "Brown", "Cream"],
        icon: "🌿",
        budgets: ["Low", "Medium", "High"],
        room: "Any"},
        
    "Scandinavian": {
        desc: "Bright spaces with light wood and simple furniture.",
        colors: ["White", "Light wood", "Sage"],
        icon: "❄️",
        budgets: ["Medium", "High"],
        room: "Medium" },
   
    "Color Pop": {
        desc: "Add bright colours and fun details.",
        colors: ["Pink", "Yellow", "Blue"],
        icon: "🌈",
        budgets: ["Low", "Medium"],
        room: "Any"
    },
    "Modern Luxury": {
        desc: "A stylish look with elegant details.",
        colors: ["Black", "Gold", "Ivory"],
        icon: "💎",
        budgets: ["High"],
        room: "Large"
    },
    "Zen": {
        desc: "A calm space with natural colours.",
        colors: ["White", "Green", "Wood"],
        icon: "🧘",
        budgets: ["Low", "Medium"],
        room: "Small" },
   
    "Study Focus": {
        desc: "A practical setup for studying.",
        colors: ["White", "Grey", "Blue"],
        icon: "📚",
        budgets: ["Low", "Medium"],
        room: "Small" },
   
    "Space Saving": {
        desc: "Make better use of a small room.",
        colors: ["White", "Sage", "Grey"],
        icon: "📦",
        budgets: ["Low", "Medium"],
        room: "Small" },
   
    "Pastel Dream": {
        desc: "Soft colours for a cute and relaxing room.",
        colors: ["Pink", "Lavender", "Blue"],
        icon: "🎀",
        budgets: ["Low", "Medium"],
        room: "Small"}};
    


// Decor suggestions and example prices in rupees.

const decor = {
    "Minimalist": [["🪴", "Plant", "₹399"], ["💡", "Lamp", "₹799"]],
    "Cozy": [["🕯️", "Candle", "₹349"], ["🧸", "Cushion", "₹449"]],
    "Biophilic": [["🌿", "Money Plant", "₹399"], ["🪴", "Succulent", "₹249"]],
    "Scandinavian": [["🪵", "Wood Table", "₹1299"], ["💡", "Nordic Lamp", "₹899"]],
    "Color Pop": [["🌸", "Pink Pillow", "₹399"], ["🖼️", "Art", "₹499"]],
    "Modern Luxury": [["✨", "Gold Vase", "₹699"], ["🪞", "Mirror", "₹1299"]],
    "Zen": [["🪴", "Bonsai", "₹899"], ["🕯️", "Candle", "₹399"]],
    "Study Focus": [["💡", "Lamp", "₹899"], ["📚", "Shelf", "₹1299"]],
    "Space Saving": [["🧺", "Storage Basket", "₹799"], ["🪝", "Wall Hook", "₹299"]],
    "Pastel Dream": [["🌸", "Vase", "₹399"], ["🧸", "Plushie", "₹499"]]};


let radarChart = null;

// Keep wishlist items saved in this browser.

let wishlist = JSON.parse(localStorage.getItem("astra_wish") || "[]");
document.getElementById("wishCount").textContent = wishlist.length;

const drop = document.getElementById("drop");
const file = document.getElementById("file");
const preview = document.getElementById("prev");

drop.addEventListener("click", function(event) {
    if (event.target !== file) {
        file.click();
    }});


drop.addEventListener("dragover", function(event) {
    event.preventDefault();
                                      });

drop.addEventListener("drop", function(event) {
    event.preventDefault();

    const image = event.dataTransfer.files[0];

    if (image && image.type.startsWith("image/")) 
    {
        showImage(image);}});
    


file.addEventListener("change", function() 
{
    if (file.files[0]) 
    { showImage(file.files[0]);}});
 


// Show the selected photo on the page.

function showImage(image) {
    const reader = new FileReader();

    reader.onload = function(event)
     {
        preview.src = event.target.result;
        preview.style.display = "block"; };
   

    reader.readAsDataURL(image);}


// Work out how well a style matches the selected preferences.

function getScore(name, room, budget, preference, spaceNeed) {
    const style = designs[name];
    let score = 0;

    if (style.room === "Any" || style.room === room) {
        score += 30;
    } else if (style.room === "Small" && room === "Medium") {
        score += 20;
    } else {
        score += 10;
    }

    if (style.budgets.includes(budget)) {
        score += 25;
    } else {
        score += 10;
    }

    if (preference === name) {
        score += 35;
    } else if (preference === "Surprise me") {
        score += 25;
    } else {
        score += 10;
    }

    if (spaceNeed === "Very important" && style.room === "Small") {
        score += 10;
    } else if (spaceNeed === "Not important") {
        score += 10;
    } else {
        score += 5;
    }

    return Math.min(score, 100);}


// Display the best matching room styles.

function analyzeRoom() 
{
    const room = document.getElementById("room").value;
    const preference = document.getElementById("pref").value;
    const budget = document.getElementById("budget").value;
    const spaceNeed = document.getElementById("space").value;

    const results = Object.keys(designs).map(function(name) 
    {
        return {
            name: name,
            score: getScore(name, room, budget, preference, spaceNeed),
            desc: designs[name].desc,
            colors: designs[name].colors,
            icon: designs[name].icon }; });
       
   

    results.sort(function(a, b) 
       { return b.score - a.score;  });
 

    const topResults = results.slice(0, 6);
    const resultBox = document.getElementById("results");

    resultBox.innerHTML = "";

    topResults.forEach(function(style, index) {
        const item = document.createElement("div");
        item.className = "result";

        const icon = document.createElement("div");
        icon.style.fontSize = "36px";
        icon.textContent = style.icon;

        const info = document.createElement("div");
        info.style.flex = "1";

        const title = document.createElement("div");
        title.style.fontWeight = "bold";
        title.textContent = "#" + (index + 1) + " " + style.name;

        const description = document.createElement("div");
        description.style.fontSize = "12px";
        description.style.color = "#666";
        description.textContent = style.desc;

        const colors = document.createElement("div");

        style.colors.forEach(function(color) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = color;
            colors.appendChild(tag);
        });

        const bar = document.createElement("div");
        bar.className = "bar";

        const fill = document.createElement("div");
        fill.className = "fill";
        fill.style.width = style.score + "%";
        bar.appendChild(fill);

        const score = document.createElement("div");
        score.className = "score";
        score.textContent = style.score + "%";

        info.append(title, description, colors, bar);
        item.append(icon, info, score);

        item.addEventListener("click", function() {
            showDetail(style.name, style.score);
        });

        resultBox.appendChild(item);
    });

    // Update the chart using the selected preferences.

    const chartScores = [
        getScore("Space Saving", room, budget, preference, spaceNeed),
        getScore("Minimalist", room, budget, preference, spaceNeed),
        getScore("Study Focus", room, budget, preference, spaceNeed),
        getScore("Cozy", room, budget, preference, spaceNeed),
        getScore("Biophilic", room, budget, preference, spaceNeed)];
    

    const context = document.getElementById("radar").getContext("2d");

    if (radarChart) 
    {radarChart.destroy();}
    

    radarChart = new Chart(context, 
    {
        type: "radar",
        data: 
            { labels: ["Space Saving", "Minimalist", "Study", "Comfort", "Nature"],
            datasets: [{
                label: "Style Match",
                data: chartScores,
                backgroundColor: "rgba(108,74,182,0.2)",
                borderColor: "#6c4ab6",
                pointBackgroundColor: "#6c4ab6" }] },
           
       
        options: {
            scales: 
            {
                r: {
                    min: 0,
                    max: 100,
                    ticks: {
                        stepSize: 20 }}}}});}
                    
                
            
           
   


// Show details and decor ideas for the selected style.

function showDetail(name, score) 
{
    const items = decor[name] || [];
    const room = document.getElementById("room").value;
    const detail = document.getElementById("detail");

    detail.style.display = "block";

    const card = document.createElement("div");
    card.className = "card";


    const hero = document.createElement("div");
    hero.className = "hero";



    const icon = document.createElement("div");
    icon.style.fontSize = "48px";
    icon.textContent = designs[name].icon;

    const heading = document.createElement("div");
    const title = document.createElement("h2");
    title.textContent = name + " - " + score + "% match";

    const description = document.createElement("p");
    description.style.fontSize = "13px";
    description.style.color = "#666";
    description.textContent = "A few ideas for your " + room.toLowerCase() + " room.";



    heading.append(title, description);
    hero.append(icon, heading);
    card.appendChild(hero);

    const subtitle = document.createElement("h3");
    subtitle.textContent = "Decor ideas";
    card.appendChild(subtitle);



    const grid = document.createElement("div");
    grid.className = "decor-grid";



    items.forEach(function(item) 
    {
        const decorCard = document.createElement("div");
        decorCard.className = "decor";

        const emoji = document.createElement("div");
        emoji.style.fontSize = "32px";
        emoji.textContent = item[0];

        const nameText = document.createElement("b");
        nameText.style.fontSize = "13px";
        nameText.textContent = item[1];

        const price = document.createElement("p");
        price.style.fontSize = "11px";
        price.textContent = item[2];

        const button = document.createElement("button");
        button.className = "btn";
        button.style.background = "#eee7ff";
        button.style.color = "#6c4ab6";
        button.textContent = "Add to wishlist";

        button.addEventListener("click", function() {
            addWish(item[1]);});
        

        decorCard.append(emoji, nameText, price, button);
        grid.appendChild(decorCard);
    });

    card.appendChild(grid);
    detail.replaceChildren(card);

    detail.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });}


// Save an item to the wishlist.

function addWish(name) 
{
    wishlist.push(name);

    localStorage.setItem("astra_wish", JSON.stringify(wishlist));
    document.getElementById("wishCount").textContent = wishlist.length;

    alert(name + " added to your wishlist!");}


</script>

</body>
</html>
